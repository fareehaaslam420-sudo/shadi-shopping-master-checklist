<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaadi Ultimate Master Shopping Checklist</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --card-hover: #1f232c;
    --gold: #eab308;
    --gold-dim: rgba(234, 179, 8, 0.15);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #2a2f3a;
    --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 16px; max-width: 820px; margin: 0 auto; padding-bottom: 80px; }
  header { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 1.35rem; color: var(--gold); margin-bottom: 6px; }
  .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  .progress-wrap { background: #262a34; height: 10px; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar { background: linear-gradient(90deg, #ca8a04, #eab308); height: 100%; width: 0%; transition: width 0.3s ease; }
  .stats-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  input[type="text"], select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; outline: none;
  }
  input[type="text"] { flex: 1; min-width: 180px; }
  input[type="text"]:focus, select:focus { border-color: var(--gold); }
  button {
    background: var(--gold); color: #0f1115; border: none; padding: 10px 14px;
    border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.active-filter { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }
  .filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .cat-pill {
    white-space: nowrap; padding: 6px 12px; border-radius: 99px; font-size: 0.8rem;
    background: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
  }
  .cat-pill.active { background: var(--gold); color: #0f1115; font-weight: 600; border-color: var(--gold); }
  .category-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .category-header {
    padding: 14px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--gold); font-size: 0.95rem;
  }
  .cat-count { font-size: 0.78rem; color: var(--muted); font-weight: normal; }
  .item-row {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--card-hover); }
  .checkbox {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
  }
  .item-row.checked .checkbox { background: var(--green); border-color: var(--green); color: #fff; }
  .item-content { flex: 1; }
  .item-title { font-size: 0.92rem; font-weight: 500; line-height: 1.35; }
  .item-row.checked .item-title { text-decoration: line-through; color: var(--muted); }
  .item-note { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .del-btn { background: transparent; color: #ef4444; padding: 4px 8px; font-size: 0.85rem; border: none; }
  .add-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #0f1115; padding: 10px 20px; border-radius: 99px;
    font-weight: 600; font-size: 0.85rem; display: none; z-index: 999; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<header>
  <h1>Shaadi Ultimate Master Shopping Checklist</h1>
  <p class="subtitle">Offline Interactive Tracker • Auto-Saves in Browser</p>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="stats-row">
    <span id="statsText">0 / 0 Completed (0%)</span>
    <span id="remainingText">0 Remaining</span>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search items (e.g., Fridge, Dinner Set, Towel)...">
  <button class="secondary active-filter" data-status="all" onclick="setStatus('all', this)">All</button>
  <button class="secondary" data-status="remaining" onclick="setStatus('remaining', this)">Remaining</button>
  <button class="secondary" data-status="done" onclick="setStatus('done', this)">Purchased</button>
  <button onclick="copyText()">Copy Checklist Text</button>
</div>

<div class="add-box">
  <input type="text" id="newItemTitle" placeholder="Add new item name...">
  <select id="newItemCat"></select>
  <button onclick="addNewItem()">+ Add</button>
</div>

<div class="filter-bar" id="catFilters"></div>
<div id="checklistContainer"></div>
<div class="toast" id="toast">Copied to clipboard!</div>

let items = JSON.parse(localStorage.getItem('shaadi_checklist_v2')) || DEFAULT_ITEMS;
let activeCategory = 'All';
let activeStatus = 'all';

function save() {
  localStorage.setItem('shaadi_checklist_v2', JSON.stringify(items));
  render();
}

function toggleItem(id) {
  items = items.map(it => it.id === id ? { ...it, checked: !it.checked } : it);
  save();
}

function deleteItem(e, id) {
  e.stopPropagation();
  items = items.filter(it => it.id !== id);
  save();
}

function addNewItem() {
  const titleInput = document.getElementById('newItemTitle');
  const catSelect = document.getElementById('newItemCat');
  const title = titleInput.value.trim();
  if (!title) return;
  items.push({
    id: Date.now(),
    cat: catSelect.value,
    title: title,
    note: "Custom added item",
    checked: false
  });
  titleInput.value = '';
  save();
}

function setCategory(cat) {
  activeCategory = cat;
  render();
}

function setStatus(status, btn) {
  activeStatus = status;
  document.querySelectorAll('.controls button.secondary').forEach(b => b.classList.remove('active-filter'));
  btn.classList.add('active-filter');
  render();
}

function copyText() {
  const cats = [...new Set(items.map(i => i.cat))];
  let out = "Shaadi Ultimate Master Shopping Checklist\n\n";
  cats.forEach(c => {
    out += `=== ${c.toUpperCase()} ===\n`;
    items.filter(i => i.cat === c).forEach(i => {
      out += `${i.checked ? '☑' : '☐'} ${i.title}${i.note ? ' — ' + i.note : ''}\n`;
    });
    out += "\n";
  });
  navigator.clipboard.writeText(out).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2200);
  });
}

function render() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const total = items.length;
  const done = items.filter(i => i.checked).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('statsText').textContent = `${done} / ${total} Completed (${pct}%)`;
  document.getElementById('remainingText').textContent = `${total - done} Remaining`;

  const allCats = [...new Set(items.map(i => i.cat))];
  const catSelect = document.getElementById('newItemCat');
  if (catSelect.options.length === 0) {
    allCats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      catSelect.appendChild(opt);
    });
  }

  const filterBar = document.getElementById('catFilters');
  filterBar.innerHTML = `<div class="cat-pill ${activeCategory === 'All' ? 'active' : ''}" onclick="setCategory('All')">All (${total})</div>` +
    allCats.map(c => `<div class="cat-pill ${activeCategory === c ? 'active' : ''}" onclick="setCategory('${c.replace(/'/g, "\'")}')">${c}</div>`).join('');

  const container = document.getElementById('checklistContainer');
  container.innerHTML = '';

  const displayCats = activeCategory === 'All' ? allCats : [activeCategory];
  displayCats.forEach(cat => {
    const catItems = items.filter(i => {
      if (i.cat !== cat) return false;
      if (activeStatus === 'remaining' && i.checked) return false;
      if (activeStatus === 'done' && !i.checked) return false;
      if (query && !i.title.toLowerCase().includes(query) && !i.note.toLowerCase().includes(query)) return false;
      return true;
    });

    if (catItems.length === 0) return;
    const catDone = items.filter(i => i.cat === cat && i.checked).length;
    const catTotal = items.filter(i => i.cat === cat).length;

    const sec = document.createElement('div');
    sec.className = 'category-section';
    sec.innerHTML = `
      <div class="category-header">
        <span>${cat}</span>
        <span class="cat-count">${catDone}/${catTotal}</span>
      </div>
      ${catItems.map(i => `
        <div class="item-row ${i.checked ? 'checked' : ''}" onclick="toggleItem(${i.id})">
          <div class="checkbox">${i.checked ? '✓' : ''}</div>
          <div class="item-content">
            <div class="item-title">${i.title}</div>
            <div class="item-note">${i.note}</div>
          </div>
          <button class="del-btn" title="Remove" onclick="deleteItem(event, ${i.id})">✕</button>
        </div>
      `).join('')}
    `;
    container.appendChild(sec);
  });
}

document.getElementById('searchInput').addEventListener('input', render);
render();
</script>
